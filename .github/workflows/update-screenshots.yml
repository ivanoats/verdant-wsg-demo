name: Update screenshots

# When a visual change is intended, add the `update-screenshots` label to the
# pull request (or run this from the Actions tab on the branch). It re-renders
# the gallery baselines on the same pinned runner CI uses and commits them to
# the branch, so the new images are reviewed in the PR diff.
# Pushes made with GITHUB_TOKEN do not start CI, so push any commit (or re-run
# CI) afterwards to see the checks pass.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'update-screenshots')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Render baselines
        run: ./node_modules/.bin/playwright test tests/visual.spec.mjs --update-snapshots
        env:
          CI: 'true'
      - name: Commit baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/__screenshots__
          if git diff --cached --quiet; then
            echo 'Baselines already up to date.'
          else
            git commit -m 'Update gallery screenshot baselines'
            git push
          fi
